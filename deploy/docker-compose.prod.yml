services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-isbrh}
      POSTGRES_USER: ${DB_USER:-isbrh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-isbrh}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ../app/backend
      dockerfile: Dockerfile.prod
    env_file: /etc/isbrh/prod.env
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: app/frontend/Dockerfile.prod
    ports:
      - "3004:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata-prod:
